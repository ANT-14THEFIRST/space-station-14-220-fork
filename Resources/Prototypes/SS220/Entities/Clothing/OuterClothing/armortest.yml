- type: entity
  parent: ClothingOuterBase
  id: ClothingOuterArmorBulletproofAlt
  name: TEST VEST CERAMICS
  description: Designed for those who value their life and health above all else.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Armor/bulletproof.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Armor/bulletproof.rsi
  - type: AltArmor
    damageaffects: true
    zeroprotection: 240
    tresholddict:
      Radiation: 1000
      Poison: 1000
      Airloss: 1000
      Caustic: 1000
      Piercing: 40
      Blunt: 20
      Heat: 30
      Slash: 35
      Shock: 30
    durabilitytresholddict:
      Radiation: 1000
      Poison: 1000
      Airloss: 1000
      Caustic: 1000
      Piercing: 8
      Blunt: 15
      Heat: 15
      Slash: 15
      Shock: 40
  - type: Damageable
    damageContainer: Shield
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 500
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
  - type: WearableAltArmor
  - type: ComplexRepairable
    material: SheetSteel
    materialRepairTreshold: 40.0
    doAfterModifier: 1
  - type: ExplosionResistance
    damageCoefficient: 0.70

